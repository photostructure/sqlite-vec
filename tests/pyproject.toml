[project]
name = "tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pytest", "numpy", "syrupy"
]

[dependency-groups]
# `make format` / `make lint` run black over the Python tests. CI's lint job
# runs clang-format from here, at the version that formatted sqlite-vec.c.
dev = ["black==26.5.1", "clang-format==21.1.8"]

[tool.uv]
# Match the npm `min-release-age=14` policy in ../.npmrc: never resolve a
# release published in the last two weeks. uv records the resolved cutoff and
# its `P14D` span in uv.lock, so an existing lock stays valid until it is
# regenerated.
exclude-newer = "14 days"

[tool.black]
# Pin the target so formatting doesn't change with black's newest-python
# inference (see PY_FORMAT_FILES in ../Makefile).
target-version = ["py312"]
