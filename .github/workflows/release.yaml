name: "Build & Prepare Release"
run-name: "Prepare ${{ github.ref_name }} for npm release"

# This workflow owns the pre-tag gate and signed release tag. The tag-bound
# publish.yaml workflow rebuilds and stages the npm package with isolated OIDC
# authority. A maintainer approves the staged package with 2FA on npmjs.com.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify default-branch CI
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Read Test and Memory Tests results for the release SHA.
      contents: read
    steps:
      - name: Require current default branch with successful CI
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi

          REMOTE_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha'
          )"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::$DEFAULT_BRANCH moved after this release run started; run it again"
            exit 1
          fi

          for WORKFLOW in test.yaml memory-tests.yaml; do
            RUNS="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?branch=$DEFAULT_BRANCH&event=push&per_page=100"
            )"
            if ! jq -e --arg sha "$GITHUB_SHA" '
              .workflow_runs
              | any(.head_sha == $sha and .conclusion == "success")
            ' <<< "$RUNS" >/dev/null; then
              echo "::error::$WORKFLOW has no successful push run for $GITHUB_SHA"
              exit 1
            fi
          done

  prepare-release:
    name: Prepare signed release branch
    needs: verify-release-source
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Push the temporary signed release branch.
    outputs:
      release_branch: ${{ steps.prepare.outputs.branch }}
      new_version: ${{ steps.prepare.outputs.version }}
      release_commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          # This isolated job must push the temporary release branch. It has no
          # npm OIDC authority.
          persist-credentials: true

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          # Node.js 24.19.0 bundles npm 11.17.0; staged publishing needs 11.15.0
          # or later. The stage job reverifies this at run time.
          node-version: "24.19.0"
          package-manager-cache: false

      - uses: photostructure/git-ssh-signing-action@fdd4b062a9ba41473f013258cc9c7eea1640f826 # v1.2.0
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Prepare release branch
        id: prepare
        run: ./scripts/prepare-release.sh

  build-linux-x64:
    name: Build linux-x64
    needs: [prepare-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - run: ./scripts/vendor.sh
      - run: make loadable
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-x64
          path: dist/vec0.so
          retention-days: 1

  build-linux-arm64:
    name: Build linux-arm64
    needs: [prepare-release]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - run: ./scripts/vendor.sh
      - run: make loadable
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-arm64
          path: dist/vec0.so
          retention-days: 1

  build-linux-x64-musl:
    name: Build linux-x64-musl
    needs: [prepare-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tmp/project" \
            --entrypoint /bin/sh \
            --platform linux/amd64 \
            alpine:3.23 \
            -c 'apk add build-base bash curl unzip --update-cache &&
                cd /tmp/project &&
                ./scripts/vendor.sh &&
                make loadable'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-x64-musl
          path: dist/vec0.so
          retention-days: 1

  build-linux-arm64-musl:
    name: Build linux-arm64-musl
    needs: [prepare-release]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tmp/project" \
            --entrypoint /bin/sh \
            --platform linux/arm64 \
            alpine:3.23 \
            -c 'apk add build-base bash curl unzip --update-cache &&
                cd /tmp/project &&
                ./scripts/vendor.sh &&
                make loadable'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-arm64-musl
          path: dist/vec0.so
          retention-days: 1

  build-darwin-x64:
    name: Build darwin-x64
    needs: [prepare-release]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - run: ./scripts/vendor.sh
      - run: make loadable
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: darwin-x64
          path: dist/vec0.dylib
          retention-days: 1

  build-darwin-arm64:
    name: Build darwin-arm64
    needs: [prepare-release]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - run: ./scripts/vendor.sh
      - run: make loadable
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: darwin-arm64
          path: dist/vec0.dylib
          retention-days: 1

  build-win32-x64:
    name: Build win32-x64
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: ./scripts/vendor.sh
        shell: bash
      - run: make loadable-msvc-x64
        shell: bash
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win32-x64
          path: dist/vec0.dll
          retention-days: 1

  build-win32-arm64:
    name: Build win32-arm64
    needs: [prepare-release]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - run: ./scripts/vendor.sh
        shell: bash
      - run: make loadable-msvc-arm64
        shell: bash
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win32-arm64
          path: dist/vec0.dll
          retention-days: 1

  rehearse-package:
    name: Rehearse exact npm package
    runs-on: ubuntu-24.04
    needs:
      [
        prepare-release,
        build-linux-x64,
        build-linux-arm64,
        build-linux-x64-musl,
        build-linux-arm64-musl,
        build-darwin-x64,
        build-darwin-arm64,
        build-win32-x64,
        build-win32-arm64,
      ]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-x64
          path: dist/linux-x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-arm64
          path: dist/linux-arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-x64-musl
          path: dist/linux-x64-musl
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-arm64-musl
          path: dist/linux-arm64-musl
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: darwin-x64
          path: dist/darwin-x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: darwin-arm64
          path: dist/darwin-arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win32-x64
          path: dist/win32-x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win32-arm64
          path: dist/win32-arm64

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          # Node.js 24.19.0 bundles npm 11.17.0; staged publishing needs 11.15.0
          # or later. The stage job reverifies this at run time.
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Pack and verify the release candidate
        run: ./scripts/package-npm.sh rehearsal-package

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rehearsal-package
          path: rehearsal-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Install the release candidate on each target and load its binary through
  # both entry points, so a tarball that resolves or loads the wrong binary
  # never gets tagged.
  verify-package:
    name: Verify package on ${{ matrix.target }}
    needs: [prepare-release, rehearse-package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            binary: dist/linux-x64/vec0.so
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: dist/linux-arm64/vec0.so
          - target: linux-x64-musl
            runner: ubuntu-24.04
            binary: dist/linux-x64-musl/vec0.so
            docker-platform: linux/amd64
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            binary: dist/linux-arm64-musl/vec0.so
            docker-platform: linux/arm64
          - target: darwin-x64
            runner: macos-15-intel
            binary: dist/darwin-x64/vec0.dylib
          - target: darwin-arm64
            runner: macos-14
            binary: dist/darwin-arm64/vec0.dylib
          - target: win32-x64
            runner: windows-latest
            binary: dist/win32-x64/vec0.dll
          - target: win32-arm64
            runner: windows-11-arm
            binary: dist/win32-arm64/vec0.dll
    env:
      SQLITE_VEC_EXPECTED_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rehearsal-package
          path: rehearsal-package

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        if: ${{ !matrix.docker-platform }}
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Test the installed package
        if: ${{ !matrix.docker-platform }}
        shell: bash
        run: tests/test-npm-package.sh rehearsal-package/*.tgz

      - name: Test the installed package on Alpine
        if: ${{ matrix.docker-platform }}
        env:
          DOCKER_PLATFORM: ${{ matrix.docker-platform }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tmp/project:ro" \
            -w /tmp/project \
            -e SQLITE_VEC_EXPECTED_BINARY \
            --platform "$DOCKER_PLATFORM" \
            node:24.19.0-alpine3.23 \
            sh tests/test-npm-package.sh rehearsal-package/*.tgz

  finalize-release:
    name: Create signed release tag
    runs-on: ubuntu-24.04
    needs: [prepare-release, rehearse-package, verify-package]
    permissions:
      contents: write # Atomically push main and the signed release tag.
    outputs:
      tag: ${{ steps.finalize.outputs.tag }}
    env:
      NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
      RELEASE_BRANCH: ${{ needs.prepare-release.outputs.release_branch }}
      RELEASE_COMMIT: ${{ needs.prepare-release.outputs.release_commit }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          fetch-depth: 0
          # This isolated job must push main and the signed release tag. It has
          # no dependency install or npm OIDC authority.
          persist-credentials: true

      - uses: photostructure/git-ssh-signing-action@fdd4b062a9ba41473f013258cc9c7eea1640f826 # v1.2.0
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Recheck source and create the signed tag
        id: finalize
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]]; then
            echo "::error::$DEFAULT_BRANCH moved after this release run started; run it again"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            echo "::error::Release branch moved after the build gate"
            exit 1
          fi

          TAG="v${NEW_VERSION}"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          git merge --ff-only "$RELEASE_COMMIT"
          git tag -s "$TAG" -m "$TAG"
          git push --atomic origin \
            "HEAD:refs/heads/$DEFAULT_BRANCH" \
            "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Delete release branch
        continue-on-error: true
        run: git push origin --delete "$RELEASE_BRANCH"

  dispatch-publisher:
    name: Start tag-bound npm staging
    runs-on: ubuntu-24.04
    needs: finalize-release
    permissions:
      actions: write # Dispatch publish.yaml at the signed release tag.
    steps:
      # GITHUB_TOKEN-created tag events do not start another workflow. Dispatch
      # the publisher explicitly at the signed tag so provenance names it.
      - name: Start publish.yaml at the signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.finalize-release.outputs.tag }}
        run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
